<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>GM Vision</title>
  <style>
    :root { color-scheme: dark; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0; padding: 10px;
      background: #1c1b22; color: #eee; font-size: 13px;
    }
    h2 {
      margin: 0 0 10px; font-size: 12px; opacity: 0.6;
      font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px;
    }
    button {
      display: flex; align-items: center; gap: 10px;
      width: 100%; padding: 8px 10px; margin-bottom: 4px;
      background: #2a2933; border: 1px solid #3a3946;
      color: #eee; border-radius: 6px;
      text-align: left; cursor: pointer; font-size: 13px;
    }
    button:hover { background: #353443; }
    button.active { background: #3b5bdb; border-color: #4c6ef5; }
    .swatch {
      width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
    }
    .section { margin-bottom: 12px; }
  </style>
</head>
<body>
  <div class="section">
    <h2>View as</h2>
    <div id="modes"></div>
  </div>

  <script type="module">
    import OBR from "https://esm.sh/@owlbear-rodeo/sdk@3";

    const EXTENSION_ID = "com.example.chromofog";
    const MODE_CHANNEL = `${EXTENSION_ID}/viewMode`;

    OBR.onReady(async () => {
      const container = document.getElementById("modes");

      const myId = await OBR.player.getId();
      const myName = await OBR.player.getName();
      const myColor = await OBR.player.getColor();
      const party = await OBR.party.getPlayers();

      // Build the mode list: self, party, then one entry per party member.
      const modes = [
        { key: "self",   label: `${myName} (you)`, color: myColor },
        { key: "party",  label: "Entire party",    color: "#aaaaaa" },
        ...party.map(p => ({
          key: `player:${p.id}`,
          label: p.name,
          color: p.color,
        })),
      ];

      // Read current mode from local storage so it survives popover close/reopen.
      let currentMode = localStorage.getItem(MODE_CHANNEL) || "self";

      const render = () => {
        container.innerHTML = modes.map(m => `
          <button data-mode="${m.key}" class="${m.key === currentMode ? "active" : ""}">
            <span class="swatch" style="background:${m.color}"></span>
            <span>${escapeHtml(m.label)}</span>
          </button>
        `).join("");
      };

      render();

      container.addEventListener("click", async (e) => {
        const btn = e.target.closest("button");
        if (!btn) return;
        currentMode = btn.dataset.mode;
        localStorage.setItem(MODE_CHANNEL, currentMode);
        render();

        // Broadcast the mode change over OBR's local broadcast channel so the
        // background iframe (which is where main.js runs) picks it up.
        await OBR.broadcast.sendMessage(MODE_CHANNEL, currentMode, {
          destination: "LOCAL",
        });
      });
    });

    function escapeHtml(s) {
      return s.replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }
  </script>
</body>
</html>
